<!DOCTYPE html>

<html>

<head>
    <title>SaiPranav Hostel - Complaints</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

```
<h1>SaiPranav Hostel</h1>

<h2>📝 Complaints</h2>

<p>Submit your complaint or issue to hostel management.</p>

<form>

    <label>Complaint Type:</label>
    <br>

    <select name="complaintType">

        <option>Room Maintenance</option>
        <option>Electrical Problem</option>
        <option>Plumbing Problem</option>
        <option>Cleaning</option>
        <option>Food / Mess</option>
        <option>Wi-Fi / Internet</option>
        <option>Other</option>

    </select>

    <br><br>

    <label>Complaint:</label>
    <br>

    <textarea
        name="complaint"
        rows="6"
        cols="40"
        placeholder="Describe your problem...">
    </textarea>

    <br><br>

    <label>Priority:</label>
    <br>

    <select name="priority">

        <option>Normal</option>
        <option>Important</option>
        <option>Urgent</option>

    </select>

    <br><br>

    <button type="submit">
        Submit Complaint
    </button>

</form>

<br>

<a href="student-dashboard.html">
    ← Back to Dashboard
</a>
```

</body>

</html>
